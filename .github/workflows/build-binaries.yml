name: Build Standalone Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build Binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: envshield-linux-x64
            binary_path: dist/envshield
          - os: windows-latest
            artifact_name: envshield-windows-x64.exe
            binary_path: dist/envshield.exe
          - os: macos-latest
            artifact_name: envshield-darwin-arm64
            binary_path: dist/envshield

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Compile standalone binary with PyInstaller
        run: |
          pyinstaller --onefile --clean --name envshield --collect-all cryptography --collect-all rich src/envshield/cli/main.py

      - name: Rename and Stage Binary
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp ${{ matrix.binary_path }} release-artifacts/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts/${{ matrix.artifact_name }}
