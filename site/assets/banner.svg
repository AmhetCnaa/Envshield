<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.6" />
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="20" fill="url(#bg)" />
  <rect width="1200" height="380" rx="20" fill="url(#grid)" />
  <rect width="1200" height="380" rx="20" fill="url(#glow1)" />
  <rect width="1200" height="380" rx="20" fill="url(#glow2)" />
  <rect x="1" y="1" width="1198" height="378" rx="19" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Left Shield Emblem -->
  <g transform="translate(95, 85)" filter="url(#shadow)">
    <!-- Outer Hexagon / Shield Glow Ring -->
    <path d="M95 0 L185 38 L185 118 C185 172 146 212 95 232 C44 212 5 172 5 118 L5 38 Z" fill="#0F172A" stroke="url(#shieldGrad)" stroke-width="3" />
    <!-- Inner Shield -->
    <path d="M95 16 L170 48 L170 115 C170 160 138 195 95 213 C52 195 20 160 20 115 L20 48 Z" fill="url(#shieldGrad)" fill-opacity="0.12" />
    <!-- Lock / Keyhole / Terminal Icon inside Shield -->
    <rect x="65" y="95" width="60" height="52" rx="8" fill="url(#shieldGrad)" />
    <path d="M77 95 V76 C77 65 85 57 95 57 C105 57 113 65 113 76 V95" fill="none" stroke="url(#shieldGrad)" stroke-width="8" stroke-linecap="round" />
    <circle cx="95" cy="116" r="6" fill="#090D16" />
    <path d="M95 122 V134" stroke="#090D16" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Main Typography -->
  <g transform="translate(335, 118)">
    <!-- Pill Tag -->
    <rect x="0" y="-42" width="295" height="28" rx="14" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="-28" r="4" fill="#34D399" />
    <text x="28" y="-23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#34D399" letter-spacing="1.2">ZERO-DISK SECRET ENGINE v0.4</text>

    <!-- Title -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5">envshield</text>

    <!-- Subtitle -->
    <text x="2" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#94A3B8">
      Encrypt once with <tspan fill="#F8FAFC" font-weight="600">AES-256-GCM</tspan> &amp; <tspan fill="#F8FAFC" font-weight="600">SSH Keys</tspan>. Stream directly from <tspan fill="url(#accentGrad)" font-weight="600">locked RAM</tspan>.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(2, 112)">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#E2E8F0">⚡ 0 Disk Writes</text>

      <rect x="174" y="0" width="180" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="190" y="22" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#E2E8F0">🔑 SSH Team Vaults</text>

      <rect x="368" y="0" width="176" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="384" y="22" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#E2E8F0">🛡️ mlock / Anti-Swap</text>

      <rect x="558" y="0" width="175" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="574" y="22" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#E2E8F0">📦 .env / JSON / TOML</text>
    </g>
  </g>
</svg>
