<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envshield 3D Quantum Vault Shield - Interactive Preview</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #07090e; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body class="text-slate-100 font-sans select-none">

    <div id="canvas-container"></div>

    <!-- Top Left HUD -->
    <div class="absolute top-6 left-6 z-10 glass bg-black/60 backdrop-blur-xl border border-white/10 p-4 rounded-2xl max-w-sm space-y-2">
        <div class="flex items-center space-x-2">
            <span class="text-xl">🛡️</span>
            <span class="font-extrabold text-white text-base tracking-tight">Envshield 3D Vault Core</span>
            <span class="text-[10px] bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 px-2 py-0.5 rounded-full font-mono">v0.4.0</span>
        </div>
        <p class="text-xs text-slate-400">
            Interactive real-time WebGL rendering of the AES-256-GCM quantum cryptographic memory shield.
        </p>
        <div class="pt-2 border-t border-white/10 flex items-center justify-between text-xs font-mono text-slate-300">
            <span>Buffer Lock: <span class="text-emerald-400">ACTIVE</span></span>
            <span>Zero-Disk: <span class="text-cyan-400">0 B</span></span>
        </div>
    </div>

    <!-- Floating Interactive Controls Toolbar -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 bg-black/75 backdrop-blur-xl border border-white/10 px-6 py-3 rounded-2xl flex items-center space-x-4 shadow-2xl">
        <div class="flex items-center space-x-2">
            <button onclick="setMode('locked')" id="btn-mode-locked" class="px-3 py-1.5 rounded-xl bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 text-xs font-bold transition">
                1. Locked State
            </button>
            <button onclick="setMode('unseal')" id="btn-mode-unseal" class="px-3 py-1.5 rounded-xl bg-white/5 text-slate-300 border border-white/10 hover:text-white text-xs font-medium transition">
                2. Live Stream Unseal
            </button>
            <button onclick="setMode('canary')" id="btn-mode-canary" class="px-3 py-1.5 rounded-xl bg-white/5 text-slate-300 border border-white/10 hover:text-amber-400 text-xs font-medium transition">
                3. Honeypot Decoy
            </button>
        </div>

        <div class="h-5 w-px bg-white/20"></div>

        <div class="flex items-center space-x-2">
            <button onclick="toggleWireframe()" id="btn-wireframe" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white text-xs transition" title="Toggle Forcefield Wireframe">
                <i data-lucide="layers" class="w-4 h-4"></i>
            </button>
            <button onclick="toggleGrid()" id="btn-grid" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white text-xs transition" title="Toggle Reference Grid">
                <i data-lucide="grid" class="w-4 h-4"></i>
            </button>
            <button onclick="resetCamera()" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white text-xs transition" title="Reset Camera">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- Orbit Hint -->
    <div class="absolute bottom-6 right-6 z-10 text-xs font-mono text-slate-500 bg-black/40 px-3 py-1.5 rounded-lg border border-white/5">
        Rotate: LMB | Pan: RMB | Zoom: Wheel
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x07090e, 0.04);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.0;

        // Subtle Reference Grid
        const gridHelper = new THREE.GridHelper(20, 20, 0x1e293b, 0x0f172a);
        gridHelper.position.y = -2.2;
        scene.add(gridHelper);

        // Balanced Studio Lights
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x07090e, 0.85);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0x38bdf8, 2.5);
        dirLight.position.set(5, 7, 5);
        scene.add(dirLight);

        const pointLight1 = new THREE.PointLight(0x818cf8, 4.0, 15);
        pointLight1.position.set(-4, -2, 3);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x10b981, 2.5, 12);
        pointLight2.position.set(3, -3, -3);
        scene.add(pointLight2);

        // Vault Core (Physical Material)
        const coreGeo = new THREE.IcosahedronGeometry(1.6, 2);
        const coreMat = new THREE.MeshPhysicalMaterial({
            color: 0x0b132b,
            emissive: 0x0284c7,
            emissiveIntensity: 0.5,
            roughness: 0.12,
            metalness: 0.92,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        scene.add(coreMesh);

        // Outer Hex Forcefield
        const outerGeo = new THREE.IcosahedronGeometry(2.15, 1);
        const outerMat = new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            wireframe: true,
            transparent: true,
            opacity: 0.4
        });
        const outerMesh = new THREE.Mesh(outerGeo, outerMat);
        scene.add(outerMesh);

        // Orbital Cryptographic Torus Rings
        const ringGeo = new THREE.TorusGeometry(2.8, 0.026, 16, 120);
        const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x818cf8, transparent: true, opacity: 0.65 });
        const ring1 = new THREE.Mesh(ringGeo, ringMat1);
        ring1.rotation.x = Math.PI / 3;
        scene.add(ring1);

        const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.45 });
        const ring2 = new THREE.Mesh(ringGeo, ringMat2);
        ring2.rotation.x = -Math.PI / 3.5;
        ring2.rotation.y = Math.PI / 5;
        scene.add(ring2);

        // Particles System
        const particleCount = 280;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount*3; i+=3) {
            const radius = 2.4 + Math.random() * 1.8;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            particlePositions[i] = radius * Math.sin(phi) * Math.cos(theta);
            particlePositions[i+1] = radius * Math.sin(phi) * Math.sin(theta);
            particlePositions[i+2] = radius * Math.cos(phi);
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x38bdf8,
            size: 0.045,
            transparent: true,
            opacity: 0.85
        });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        function setMode(mode) {
            const bLocked = document.getElementById('btn-mode-locked');
            const bUnseal = document.getElementById('btn-mode-unseal');
            const bCanary = document.getElementById('btn-mode-canary');

            bLocked.className = "px-3 py-1.5 rounded-xl bg-white/5 text-slate-300 border border-white/10 hover:text-white text-xs font-medium transition";
            bUnseal.className = "px-3 py-1.5 rounded-xl bg-white/5 text-slate-300 border border-white/10 hover:text-white text-xs font-medium transition";
            bCanary.className = "px-3 py-1.5 rounded-xl bg-white/5 text-slate-300 border border-white/10 hover:text-amber-400 text-xs font-medium transition";

            if (mode === 'locked') {
                bLocked.className = "px-3 py-1.5 rounded-xl bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 text-xs font-bold transition";
                coreMat.emissive.setHex(0x0284c7);
                outerMat.color.setHex(0x38bdf8);
                particleMat.color.setHex(0x38bdf8);
                controls.autoRotateSpeed = 2.0;
            } else if (mode === 'unseal') {
                bUnseal.className = "px-3 py-1.5 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-xs font-bold transition";
                coreMat.emissive.setHex(0x059669);
                outerMat.color.setHex(0x34d399);
                particleMat.color.setHex(0x34d399);
                controls.autoRotateSpeed = 4.5;
            } else if (mode === 'canary') {
                bCanary.className = "px-3 py-1.5 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/40 text-xs font-bold transition";
                coreMat.emissive.setHex(0xd97706);
                outerMat.color.setHex(0xf59e0b);
                particleMat.color.setHex(0xf59e0b);
                controls.autoRotateSpeed = 7.0;
            }
        }

        function toggleWireframe() {
            outerMesh.visible = !outerMesh.visible;
        }

        function toggleGrid() {
            gridHelper.visible = !gridHelper.visible;
        }

        function resetCamera() {
            camera.position.set(0, 2, 8);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function animate() {
            requestAnimationFrame(animate);
            coreMesh.rotation.y += 0.005;
            coreMesh.rotation.x += 0.002;
            outerMesh.rotation.y -= 0.003;
            ring1.rotation.z += 0.008;
            ring2.rotation.z -= 0.006;
            particleSystem.rotation.y += 0.0015;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        lucide.createIcons();
    </script>
</body>
</html>
