[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envshield"
version = "0.1.0"
description = "Enterprise-grade, open-source security and environment auditing CLI tool."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
envshield = "envshield.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
addopts = "--cov=src/envshield --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
