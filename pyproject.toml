[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envshield-cli"
version = "0.4.0"
description = "Zero-disk secret engine, live stream redaction & runtime injection for developers"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.9"
keywords = [
    "secrets",
    "cli",
    "security",
    "aes-gcm",
    "env-vault",
    "ssh-keys",
    "zero-disk",
    "redaction",
    "audit-log",
    "git-hook",
    "canary",
]
dependencies = [
    "rich>=13.0.0",
    "cryptography>=42.0.0",
    "keyring>=24.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/AmhetCnaa/Envshield"
Documentation = "https://github.com/AmhetCnaa/Envshield#readme"
Repository = "https://github.com/AmhetCnaa/Envshield.git"
Issues = "https://github.com/AmhetCnaa/Envshield/issues"

[project.scripts]
envshield = "envshield.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pyinstaller>=6.0.0",
]
aws = [
    "boto3>=1.28.0",
]
gcp = [
    "google-cloud-kms>=2.15.0",
]
azure = [
    "azure-keyvault-keys>=4.7.0",
    "azure-identity>=1.12.0",
]
cloud = [
    "boto3>=1.28.0",
    "google-cloud-kms>=2.15.0",
    "azure-keyvault-keys>=4.7.0",
    "azure-identity>=1.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/envshield"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
ignore = ["BLE001", "TRY002", "TRY003", "PLW1510", "SIM117", "S110"]

[tool.pytest.ini_options]
addopts = "--cov=src/envshield --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
