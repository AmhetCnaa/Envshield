<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="ramBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
  </defs>

  <rect width="1100" height="300" rx="16" fill="#090D16" stroke="#1E293B" stroke-width="1.5" />

  <!-- Box 1: Encrypted Disk -->
  <g transform="translate(40, 55)">
    <rect width="240" height="190" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    <rect x="20" y="20" width="52" height="24" rx="6" fill="#334155" />
    <text x="46" y="36" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#E2E8F0">DISK</text>
    <text x="20" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">.env.enc Vault</text>
    <text x="20" y="98" font-family="ui-monospace, monospace" font-size="12.5" fill="#94A3B8">• AES-256-GCM Cipher</text>
    <text x="20" y="120" font-family="ui-monospace, monospace" font-size="12.5" fill="#94A3B8">• SSH / Password Slots</text>
    <text x="20" y="142" font-family="ui-monospace, monospace" font-size="12.5" fill="#94A3B8">• 100% Safe for Git</text>
    <rect x="20" y="156" width="200" height="20" rx="4" fill="#10B981" fill-opacity="0.12" />
    <text x="120" y="170" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#34D399">No Plaintext on Disk</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="290" y1="150" x2="365" y2="150" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <text x="328" y="136" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#34D399">Read Bytes</text>

  <!-- Box 2: Volatile Locked RAM -->
  <g transform="translate(380, 35)">
    <rect width="340" height="230" rx="14" fill="url(#ramBg)" stroke="#10B981" stroke-width="2" />
    <rect x="22" y="20" width="150" height="24" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="97" y="36" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#34D399">LOCKED VOLATILE RAM</text>

    <text x="22" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Envshield Memory Engine</text>
    <text x="22" y="102" font-family="ui-monospace, monospace" font-size="13" fill="#D1FAE5">1. Unlock DEK (SSH ECDH / PBKDF2)</text>
    <text x="22" y="126" font-family="ui-monospace, monospace" font-size="13" fill="#D1FAE5">2. Verify 128-bit GCM Auth Tag</text>
    <text x="22" y="150" font-family="ui-monospace, monospace" font-size="13" fill="#D1FAE5">3. Lock Pages (VirtualLock / mlock)</text>
    <text x="22" y="174" font-family="ui-monospace, monospace" font-size="13" fill="#D1FAE5">4. Parse .env / JSON / TOML in RAM</text>
    <text x="22" y="198" font-family="ui-monospace, monospace" font-size="13" fill="#34D399" font-weight="bold">5. Zero-Wipe Buffer on Exit (memset)</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="730" y1="150" x2="805" y2="150" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="768" y="136" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#38BDF8">execve / env</text>

  <!-- Box 3: Target Process -->
  <g transform="translate(820, 55)">
    <rect width="240" height="190" rx="12" fill="url(#cardBg)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7" />
    <rect x="20" y="20" width="76" height="24" rx="6" fill="#0284C7" fill-opacity="0.25" />
    <text x="58" y="36" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#38BDF8">RUNTIME</text>
    <text x="20" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Your Application</text>
    <text x="20" y="98" font-family="ui-monospace, monospace" font-size="12.5" fill="#94A3B8">• Python / FastAPI / Django</text>
    <text x="20" y="120" font-family="ui-monospace, monospace" font-size="12.5" fill="#94A3B8">• Node.js / Next.js / Bun</text>
    <text x="20" y="142" font-family="ui-monospace, monospace" font-size="12.5" fill="#94A3B8">• Go / Rust / Docker</text>
    <rect x="20" y="156" width="200" height="20" rx="4" fill="#38BDF8" fill-opacity="0.12" />
    <text x="120" y="170" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#38BDF8">Zero Code Changes Needed</text>
  </g>
</svg>
